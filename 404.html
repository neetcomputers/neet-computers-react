<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NEET Computers</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: sends an unknown deep path back to
      // index.html with the route packed into the query string, where the
      // restore snippet in index.html unpacks it. pathSegmentsToKeep = 1
      // keeps the /neet-computers-react project subpath.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
