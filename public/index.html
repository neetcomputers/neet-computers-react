    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: restores the real route after the
      // 404.html redirect packs it into the query string. Only acts when the
      // ?/ pattern is present, so it is inert on root hosting.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
